<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spice & Slice Bistro{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Custom CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">✨ Spice & Slice</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/menu">Menu</a>
                <a class="nav-link" href="/kitchen">Kitchen Dashboard</a>
                <!-- Cart Trigger Button -->
                <button class="btn btn-outline-light btn-sm ms-3 position-relative" onclick="toggleCartDrawer()">
                    🛒 Cart <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Sliding Cart Drawer -->
    <div id="cart-drawer" class="cart-drawer shadow-lg">
        <div class="cart-header d-flex justify-content-between align-items-center p-3 border-bottom bg-dark text-white">
            <h5 class="mb-0">Your Active Order</h5>
            <button class="btn-close btn-close-white" onclick="toggleCartDrawer()"></button>
        </div>
        <div class="cart-body p-3 overflow-auto" style="max-height: calc(100vh - 200px);">
            <ul id="cart-items" class="list-group list-group-flush mb-3">
                <li class="list-group-item text-muted text-center border-0">Your cart is empty</li>
            </ul>
        </div>
        <div class="cart-footer p-3 border-top bg-light">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0 fw-bold">Total:</h5>
                <h5 class="text-danger fw-bold mb-0">₹<span id="cart-total">0.00</span></h5>
            </div>
            <button id="checkout-btn" class="btn btn-danger w-100 py-2 fw-bold shadow-sm" onclick="submitOrder()">Place Order Now</button>
        </div>
    </div>
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCartDrawer()"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
